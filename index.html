
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 60px 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000015;
        }

        h1 {
            color: #2563eb;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My Website!</h1>
        <p>I am learning Full-Stack Web Development.</p>

        <button onclick="showMessage()">Click Me</button>
        <p id="result"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("result").textContent =
                "Congratulations! My website is working!";
        }
    </script>
</body>
</html>
